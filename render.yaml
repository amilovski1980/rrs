services:
  - type: web
    name: roadrunner-solutions
    runtime: python
    plan: starter
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 60"
    healthCheckPath: /compte/
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "0"
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: roadrunner-db
          property: connectionString
      - key: EMAIL_BACKEND
        value: "django.core.mail.backends.console.EmailBackend"
      - key: INSEE_API_KEY
        sync: false
      - key: INPI_TOKEN
        sync: false
      - key: LLM_BASE_URL
        sync: false
      - key: LLM_MODEL
        value: "qwen3-32b-awq"
      - key: XAI_API_KEY
        sync: false
      - key: XAI_VOICE_MODEL
        value: "grok-voice-latest"
      - key: XAI_VOICE
        value: "eve"

databases:
  - name: roadrunner-db
    plan: basic-256mb
    databaseName: roadrunner
    user: roadrunner
