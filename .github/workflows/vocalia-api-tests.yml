name: VocalIA API Django tests

on:
  push:
    branches:
      - feature/vocalia-email-onboarding
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  voice-signup-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Run Django checks and VocalIA tests
        env:
          DJANGO_SETTINGS_MODULE: config.settings
          DJANGO_SECRET_KEY: ci-only-not-production
          DJANGO_DEBUG: '0'
          DATABASE_URL: sqlite:///ci_voice_signup.sqlite3
          VOCALIA_API_TOKEN: test-secret
          EMAIL_BACKEND: django.core.mail.backends.locmem.EmailBackend
        run: |
          python manage.py check
          python manage.py test accounts.test_voice_signup --verbosity 2
