name: VocalIA API Django tests

on:
  pull_request:
    paths:
      - 'accounts/voice_signup.py'
      - 'accounts/test_voice_signup.py'
      - 'config/urls.py'
      - 'config/settings.py'
      - '.github/workflows/vocalia-api-tests.yml'
  push:
    branches:
      - feature/vocalia-email-onboarding
  workflow_dispatch:

permissions:
  contents: read

jobs:
  voice-signup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DJANGO_SETTINGS_MODULE: config.settings
      DJANGO_SECRET_KEY: ci-only-secret-not-for-production
      VOCALIA_API_TOKEN: test-secret
      DATABASE_URL: sqlite:///:memory:
      EMAIL_BACKEND: django.core.mail.backends.locmem.EmailBackend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Django system checks
        run: python manage.py check
      - name: VocalIA onboarding tests
        run: python manage.py test accounts.test_voice_signup --verbosity 2
