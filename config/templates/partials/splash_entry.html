{% comment %} Splash d'ouverture — palette claire par defaut, theme="dark" pour la monture sombre. Affiche une fois par session. {% endcomment %}
<style>
  #rrs-splash {
    position: fixed; inset: 0; z-index: 300;
    display: grid; place-items: center;
    {% if theme == 'dark' %}
    background:
      radial-gradient(120% 90% at 78% 6%, rgba(37, 99, 235, .20) 0%, transparent 58%),
      #070708;
    {% else %}
    background:
      radial-gradient(120% 90% at 78% 6%, rgba(37, 99, 235, .14) 0%, transparent 58%),
      #ffffff;
    {% endif %}
    animation: rrsSplashOut .55s cubic-bezier(.6, 0, .3, 1) 1.8s forwards;
  }
  #rrs-splash .rrs-inner {
    display: grid; justify-items: center; gap: 14px;
    animation: rrsSplashIn .6s cubic-bezier(.2, .9, .3, 1) both;
  }
  #rrs-splash .rrs-mark {
    width: 78px; height: 78px; border-radius: 22px;
    display: grid; place-items: center;
    background: linear-gradient(160deg, #5aa0ff 0%, #2563eb 58%, #1d4ed8 100%);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, .35),
      0 24px 54px -20px rgba(37, 99, 235, .6);
    position: relative;
    font-family: "Segoe UI", Inter, system-ui, sans-serif;
    animation: rrsSplashIn .7s cubic-bezier(.2, .9, .3, 1) both, rrsFloat 3s ease-in-out .8s infinite;
  }
  #rrs-splash .rrs-mark::before {
    content: ""; position: absolute; inset: -6px; border-radius: 28px;
    border: 1px solid rgba(90, 160, 255, .5);
    animation: rrsRing 2.2s ease-out infinite;
  }
  #rrs-splash .rrs-mark span {
    font-weight: 800; font-size: 34px; color: #fff;
    letter-spacing: -.04em; text-shadow: 0 2px 10px rgba(0, 0, 0, .25);
  }
  #rrs-splash .rrs-word { text-align: center; font-family: "Segoe UI", Inter, system-ui, sans-serif; }
  #rrs-splash .rrs-word b {
    display: block; font-size: 20px; letter-spacing: -.03em;
    {% if theme == 'dark' %}color: #f4f4f4;{% else %}color: #0f172a;{% endif %}
  }
  #rrs-splash .rrs-word small {
    display: block; font-size: 10px; font-weight: 800; letter-spacing: .34em;
    text-transform: uppercase; padding-left: .34em;
    {% if theme == 'dark' %}color: #8e8e8e;{% else %}color: #64748b;{% endif %}
  }
  #rrs-splash .rrs-bar {
    width: min(62vw, 230px); height: 5px; border-radius: 999px; overflow: hidden;
    {% if theme == 'dark' %}background: rgba(255, 255, 255, .10);{% else %}background: rgba(15, 23, 42, .10);{% endif %}
  }
  #rrs-splash .rrs-bar i {
    display: block; width: 0; height: 100%; border-radius: inherit;
    background-size: 200% 100%;
    {% if theme == 'dark' %}
    background-image: linear-gradient(90deg, #3ddc6a, #c6ffb1, #f4f4f4);
    {% else %}
    background-image: linear-gradient(90deg, #2563eb, #5aa0ff, #8fce9a);
    {% endif %}
    animation: rrsFill 1.8s cubic-bezier(.4, 0, .2, 1) forwards, rrsGlow 1.3s linear infinite;
  }
  @keyframes rrsSplashOut { 55% { opacity: 1; } 100% { opacity: 0; transform: scale(1.05); visibility: hidden; } }
  @keyframes rrsSplashIn { from { opacity: 0; transform: translateY(10px) scale(.95); } to { opacity: 1; transform: none; } }
  @keyframes rrsFloat { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
  @keyframes rrsRing { 0% { opacity: .9; transform: scale(1); } 70%, 100% { opacity: 0; transform: scale(1.12); } }
  @keyframes rrsFill { to { width: 100%; } }
  @keyframes rrsGlow { from { background-position: 0% 0; } to { background-position: 220% 0; } }
  @media (prefers-reduced-motion: reduce) {
    #rrs-splash { animation-duration: .01s; animation-delay: .6s; }
  }
</style>
<div id="rrs-splash" aria-label="Chargement de Road Runner Solutions">
  <div class="rrs-inner">
    <div class="rrs-mark"><span>R</span></div>
    <div class="rrs-word"><b>Road Runner</b><small>Solutions</small></div>
    <div class="rrs-bar"><i></i></div>
  </div>
</div>
<script>
  (function () {
    try {
      if (sessionStorage.getItem("rrs-splash") === "1") {
        var s = document.getElementById("rrs-splash");
        if (s) s.style.display = "none";
        return;
      }
      sessionStorage.setItem("rrs-splash", "1");
    } catch (e) {}
  })();
</script>
