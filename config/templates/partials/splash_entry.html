{% comment %} Splash d'ouverture — vrai logo, theme clair par defaut, theme="dark" pour sombre.
Joue au premier lancement apres fermeture (et re-joue apres une heure sans visite). {% endcomment %}
<style>
  #rrs-splash {
    position: fixed; inset: 0; z-index: 300;
    display: grid; place-items: center;
    {% if theme == 'dark' %}
    background: radial-gradient(120% 90% at 78% 6%, rgba(37, 99, 235, .18) 0%, transparent 58%), #070708;
    {% else %}
    background: radial-gradient(120% 90% at 78% 6%, rgba(37, 99, 235, .12) 0%, transparent 58%), #ffffff;
    {% endif %}
    animation: rrsSplashOut .55s cubic-bezier(.6, 0, .3, 1) 1.9s forwards;
  }
  #rrs-splash .rrs-logo-wrap {
    position: relative; display: grid; place-items: center;
    width: 118px; height: 118px;
    animation: rrsIn .65s cubic-bezier(.2, .9, .3, 1) both, rrsFloat 3s ease-in-out .85s infinite;
  }
  #rrs-splash .rrs-logo-wrap::before {
    content: ""; position: absolute; inset: -8px; border-radius: 32px;
    border: 1px solid {% if theme == 'dark' %}rgba(207, 207, 207, .38){% else %}rgba(90, 160, 255, .45){% endif %};
    animation: rrsRing 2.2s ease-out infinite;
  }
  #rrs-splash .rrs-logo {
    max-width: 108px; max-height: 108px; width: auto; height: auto;
    object-fit: contain; display: block;
    filter: drop-shadow(0 18px 42px rgba(0, 0, 0, .55));
  }
  #rrs-splash .rrs-word { text-align: center; font-family: "Segoe UI", Inter, system-ui, sans-serif; animation: rrsIn .7s ease both; }
  #rrs-splash .rrs-word b {
    display: block; font-size: 20px; letter-spacing: -.03em;
    {% if theme == 'dark' %}color: #f4f4f4;{% else %}color: #0f172a;{% endif %}
  }
  #rrs-splash .rrs-word small {
    display: block; font-size: 10px; font-weight: 800; letter-spacing: .34em;
    text-transform: uppercase; padding-left: .34em;
    {% if theme == 'dark' %}color: #8e8e8e;{% else %}color: #64748b;{% endif %}
  }
  #rrs-splash .rrs-bar {
    width: min(62vw, 230px); height: 5px; border-radius: 999px; overflow: hidden;
    {% if theme == 'dark' %}background: rgba(255, 255, 255, .10);{% else %}background: rgba(15, 23, 42, .10);{% endif %}
  }
  #rrs-splash .rrs-bar i {
    display: block; width: 0; height: 100%; border-radius: inherit;
    background-size: 200% 100%;
    {% if theme == 'dark' %}
    background-image: linear-gradient(90deg, #3ddc6a, #c6ffb1, #f4f4f4);
    {% else %}
    background-image: linear-gradient(90deg, #2563eb, #5aa0ff, #8fce9a);
    {% endif %}
    animation: rrsFill 1.9s cubic-bezier(.4, 0, .2, 1) forwards, rrsGlow 1.3s linear infinite;
  }
  @keyframes rrsSplashOut { 55% { opacity: 1; } 100% { opacity: 0; transform: scale(1.05); visibility: hidden; } }
  @keyframes rrsIn { from { opacity: 0; transform: translateY(12px) scale(.92); } to { opacity: 1; transform: none; } }
  @keyframes rrsFloat { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
  @keyframes rrsRing { 0% { opacity: .9; transform: scale(1); } 70%, 100% { opacity: 0; transform: scale(1.14); } }
  @keyframes rrsFill { to { width: 100%; } }
  @keyframes rrsGlow { from { background-position: 0% 0; } to { background-position: 220% 0; } }
  @media (prefers-reduced-motion: reduce) {
    #rrs-splash { animation-duration: .01s; animation-delay: .6s; }
  }
</style>
<div id="rrs-splash" aria-label="Chargement de Road Runner Solutions">
  <div class="rrs-inner">
    <div class="rrs-logo-wrap">
      {% if theme == 'dark' %}
      <img class="rrs-logo" src="/static/img/dark/mark.png" alt="Road Runner Solutions">
      {% else %}
      <img class="rrs-logo" src="/static/img/logo-192.png" alt="Road Runner Solutions">
      {% endif %}
    </div>
    <div class="rrs-word"><b>Road Runner</b><small>Solutions</small></div>
    <div class="rrs-bar"><i></i></div>
  </div>
</div>
<script>
  (function () {
    try {
      var LAST = "rrs-splash-at";
      var HOUR = 60 * 60 * 1000;
      var last = Number(localStorage.getItem(LAST) || "0");
      if (last && Date.now() - last < HOUR) {
        var s = document.getElementById("rrs-splash");
        if (s) s.style.display = "none";
        return;
      }
      localStorage.setItem(LAST, String(Date.now()));
    } catch (e) {}
  })();
</script>
