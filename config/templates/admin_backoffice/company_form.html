{% extends "admin_backoffice/dashboard.html" %}
{% block content %}
<div class="container-fluid mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>{% if object %}Modifier{% else %}Créer{% endif %} une Entreprise</h2>
        <a href="{% url 'admin_backoffice:companies' %}" class="btn btn-secondary">Retour</a>
    </div>
    <div class="card shadow-sm">
        <div class="card-body">
            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <div class="text-end mt-3">
                    <button type="submit" class="btn btn-primary">Enregistrer</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
