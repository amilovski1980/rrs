{% if is_paginated %}
<div class="pager">
  <span>Page {{ page_obj.number }} sur {{ page_obj.paginator.num_pages }}</span>
  {% if page_obj.has_previous %}
  <a href="?page={{ page_obj.previous_page_number }}&q={{ q|urlencode }}&role={{ role }}&active={{ active }}&phone={{ phone }}&status={{ status }}&level={{ level }}">Précédente</a>
  {% endif %}
  {% if page_obj.has_next %}
  <a href="?page={{ page_obj.next_page_number }}&q={{ q|urlencode }}&role={{ role }}&active={{ active }}&phone={{ phone }}&status={{ status }}&level={{ level }}">Suivante</a>
  {% endif %}
</div>
{% endif %}
