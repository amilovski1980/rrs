{% extends "admin_backoffice/base.html" %}
{% block title %}Confirmer la suppression{% endblock %}
{% block content %}
<div class="page-head">
  <div>
    <h1>Confirmer la suppression</h1>
    <p class="sub">Cette action est définitive.</p>
  </div>
</div>
<div class="card" style="max-width:640px">
  <p>Supprimer <strong>{{ object }}</strong> ?</p>
  <form method="post" class="form-actions">
    {% csrf_token %}
    <button class="btn btn-danger" type="submit">Supprimer</button>
    {% if cancel_url %}<a class="btn btn-ghost" href="{{ cancel_url }}">Annuler</a>{% endif %}
  </form>
</div>
{% endblock %}
