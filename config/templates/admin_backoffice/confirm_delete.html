{% extends "admin_backoffice/dashboard.html" %}
{% block content %}
<div class="container-fluid mt-4">
    <div class="card shadow-sm border-danger">
        <div class="card-header bg-danger text-white">
            <h4 class="mb-0">⚠️ Confirmation de suppression</h4>
        </div>
        <div class="card-body">
            <p>Êtes-vous sûr de vouloir supprimer <strong>{{ object }}</strong> ? Cette action est irréversible.</p>
            <form method="post">
                {% csrf_token %}
                <div class="d-flex justify-content-end gap-2">
                    <a href="{{ success_url }}" class="btn btn-secondary">Annuler</a>
                    <button type="submit" class="btn btn-danger">Confirmer la suppression</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
